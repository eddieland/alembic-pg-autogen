# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    # Use ["main", "master"] for CI only on the default branch.
    # Use ["**"] for CI on all branches.
    branches: ["main", "master"]
  # Every base branch, so a pull request stacked on another pull request also runs CI.
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # Update this as needed:
        # Common platforms: ["ubuntu-latest", "macos-latest", "windows-latest"]
        os: ["ubuntu-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    # Linux only by default. Use ${{ matrix.os }} for other OSes.
    runs-on: ${{ matrix.os }}

    steps:
      # Generally following uv docs:
      # https://docs.astral.sh/uv/guides/integration/github/

      - name: Checkout (official GitHub action)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Important for versioning plugins:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # Update this as needed:
          version: "0.10.2"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Set up Python (using uv)
        run: uv python install

      # Alternately can use the official Python action:
      # - name: Set up Python (using actions/setup-python)
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: ${{ matrix.python-version }}

      - name: Install all dependencies
        run: uv sync --all-extras

      - name: Check formatting (mdformat)
        run: uv run mdformat --check README.md CLAUDE.md openspec/

      - name: Check spelling (codespell)
        run: uv run codespell src tests README.md CLAUDE.md openspec/

      - name: Lint (ruff)
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Type check (basedpyright)
        run: uv run basedpyright --stats src tests

      # The squash tests need pg_dump. With ALEMBIC_PG_AUTOGEN_REQUIRE_PG_DUMP, a missing pg_dump fails them.
      - name: Install pg_dump
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_dump --version

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: uv run pytest --cov --cov-report=xml
        env:
          ALEMBIC_PG_AUTOGEN_REQUIRE_PG_DUMP: "1"

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: uv run pytest
        env:
          ALEMBIC_PG_AUTOGEN_REQUIRE_PG_DUMP: "1"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  # pg_dump must be at least as new as the server. A newer pg_dump writes settings and syntax that an older server
  # does not know, and an older pg_dump writes some statements in an older form. This job runs the squash tests with
  # pg_dump 18 against each server version, and with a pg_dump of the same version as the server. The last two runs
  # use the bootstrap role postgres, which owns schema public on PostgreSQL 14.
  squash-pg-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg-version: "14", pg-dump: "18", pg-user: "test" }
          - { pg-version: "16", pg-dump: "18", pg-user: "test" }
          - { pg-version: "17", pg-dump: "18", pg-user: "test" }
          - { pg-version: "18", pg-dump: "18", pg-user: "test" }
          - { pg-version: "14", pg-dump: "14", pg-user: "postgres" }
          - { pg-version: "16", pg-dump: "16", pg-user: "postgres" }
    name: squash-pg-versions (server ${{ matrix.pg-version }}, pg_dump ${{ matrix.pg-dump }}, ${{ matrix.pg-user }})

    steps:
      - name: Checkout (official GitHub action)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.2"
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install pg_dump from the PostgreSQL apt repository
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-${{ matrix.pg-dump }}"
          echo "/usr/lib/postgresql/${{ matrix.pg-dump }}/bin" >> "$GITHUB_PATH"

      - name: Run the squash tests
        run: |
          pg_dump --version
          uv run pytest tests/alembic_pg_autogen/test_squash.py --pg-version "${{ matrix.pg-version }}"
        env:
          ALEMBIC_PG_AUTOGEN_REQUIRE_PG_DUMP: "1"
          ALEMBIC_PG_AUTOGEN_TEST_PG_USER: ${{ matrix.pg-user }}
